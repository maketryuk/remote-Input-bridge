[package]
name = "rib-sender"
version = "0.2.9"
edition = "2021"
description = "Remote Input Bridge - Windows sender"
license = "MIT"
repository = "https://github.com/maketryuk/remote-Input-bridge"

[[bin]]
name = "rib-sender"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
getrandom = "0.2"
subtle = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_HumanInterfaceDevice",
] }

# Host-gated: the icon, the version resource and the manifest are compiled by rc.exe from the
# MSVC toolchain, which only exists on a Windows host. `cargo check --target
# x86_64-pc-windows-msvc` from a Mac therefore skips it, and build.rs is written to cope.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

